name: Windows installer
on:
  push:
    tags: ['v*']
    branches: [feature/phase-6-release]
    paths:
      - .github/workflows/windows-release.yml
      - electron-builder.yml
      - scripts/smoke-packaged.mjs
      - scripts/collect-licenses.mjs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Validate release tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = (Get-Content package.json | ConvertFrom-Json).version
            if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match package.json version' }
          }
      - run: npm ci
      - run: npm test
      - name: Build unsigned Windows x64 installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Smoke test the packaged Windows executable
        run: npm run test:packaged
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          Get-ChildItem release/*.exe | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($_.Name)" | Set-Content -Encoding ascii "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: wrestling-vault-windows-x64
          path: |
            release/*.exe
            release/*.exe.sha256
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-packaged-screenshot
          path: artifacts/screenshots/windows-packaged.png
          if-no-files-found: ignore
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: wrestling-vault-windows-x64
          path: release
      - name: Publish installer
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "Wrestling Vault $RELEASE_TAG" --notes-file docs/release-notes.md release/*.exe release/*.exe.sha256
          gh release edit "$RELEASE_TAG" --draft=false
